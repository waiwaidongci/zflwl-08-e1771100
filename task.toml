schema_version = "1.3"

[task]
name = "local/doppler-spectral-line-association"
description = "Identify unknown Doppler-shifted spectral lines and recover velocity from multi-line support."
authors = [{ name = "yuenlai" }]
keywords = ["astronomy", "spectroscopy", "matching", "doppler-inversion"]

[agent]
timeout_sec = 3600

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true

[verifier]
timeout_sec = 180

[metadata]
difficulty = "hard"
category = "scientific-computing"
tags = ["spectral-lines", "consensus-search", "doppler-matching"]
expert_time_estimate = "50m"
